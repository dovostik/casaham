name: Update data & alert

on:
  schedule:
    # Jam bursa 09:00–16:00 WIB = 02:00–09:00 UTC, Senin–Jumat, tiap 30 menit
    - cron: "*/30 2-9 * * 1-5"
    # Sesudah penutupan (±16:45 WIB)
    - cron: "45 9 * * 1-5"
  push:
    branches: [main]
    paths: ["alerts.yml", "docs/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pulihkan status alert
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Ambil data, screener, kirim alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://casaham.pages.dev/
          REPO: ${{ github.repository }}
        run: python scripts/update.py

      - name: Simpan status alert
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}

      - name: Deploy ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create casaham --production-branch=main || true
          command: pages deploy docs --project-name=casaham --branch=main --commit-dirty=true
