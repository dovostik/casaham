name: Uji broksum
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - working-directory: scripts
        run: |
          python - <<'PY'
          import broksum as B
          from datetime import date
          for c in ["SOLA", "HOPE", "BBCA", "MERI"]:
              try:
                  print("::notice::", c, B.top3_prev(c, date.today().isoformat()))
              except Exception as e:
                  print("::notice::", c, "ERROR", e)
          PY
