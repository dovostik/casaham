name: Uji broksum GoAPI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - working-directory: scripts
        env:
          GOAPI_KEY: ${{ secrets.GOAPI_KEY }}
        run: |
          python - <<'PY'
          import json, broksum as B
          for sym, d, extra in [("HOPE", "2026-11-17", {}), ("NTBK", "2026-11-17", {}), ("AREA", "2026-11-17", {})]:
              try:
                  js = B._get(f"/{sym}/broker_summary", date=d, **extra)
                  rows = (js.get("data") or {}).get("results") or []
                  print("::notice::", sym, d, js.get("status"), js.get("message"), "rows", len(rows), json.dumps(rows[:2])[:600])
              except Exception as e:
                  print("::notice:: ERROR", sym, repr(e)[:400])
          PY
