name: Uji broksum
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - working-directory: scripts
        run: |
          python - <<'PY'
          import urllib.request
          import broksum as B
          from datetime import date
          url = B.ENDPOINT + "?code=SOLA&start=11/17/2026&end=11/17/2026&fd=all&board=all"
          for ua in ["Mozilla/5.0 (casaham; personal use)", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua, "Referer": "https://www.indopremier.com/"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8", "replace")
                      print("::notice::", r.status, len(body), body[:700].replace("\n", " "))
                      print("::notice::", "parse", str(B.parse(body))[:600])
              except Exception as e:
                  print("::notice::", "ERROR", repr(e)[:400])
          PY
