name: Screener realtime (tiap 1 menit)

on:
  schedule:
    # Sesi 1: mulai 08:38 WIB, scan sampai 12:05 WIB
    - cron: "38 1 * * 1-5"
    # Sesi 2: mulai 13:08 WIB, scan sampai 16:10 WIB
    - cron: "8 6 * * 1-5"
  workflow_dispatch:
    inputs:
      until:
        description: "Scan sampai jam (WIB, HH:MM)"
        default: "16:10"

permissions:
  contents: write  # untuk menyimpan jurnal sinyal ke repo
  actions: write   # untuk memicu 'Update data web' tiap 30 menit

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Ambil jurnal terbaru dari repo
        run: git fetch -q origin main && git checkout origin/main -- jurnal 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pulihkan status alert
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Tentukan jam selesai
        id: t
        run: |
          H=$(TZ=Asia/Jakarta date +%H%M)
          U="${{ inputs.until }}"
          # sesi pagi selalu berhenti 12:05 (batas runner 5 jam), sesi siang 16:10
          if [ "$H" -lt 1200 ]; then
            if [ -z "$U" ] || [ "${U/:/}" -gt 1205 ]; then U="12:05"; fi
          else
            [ -z "$U" ] && U="16:10"
          fi
          echo "until=$U" >> $GITHUB_OUTPUT
          echo "Mulai $(TZ=Asia/Jakarta date +%H:%M) WIB, scan sampai $U"

      - name: Scan tiap menit
        working-directory: scripts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://casaham.pages.dev/
          UNTIL: ${{ steps.t.outputs.until }}
          PYTHONUNBUFFERED: "1"
          GOAPI_KEY: ${{ secrets.GOAPI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python realtime.py

      - name: Simpan jurnal ke repo
        if: always()
        run: |
          [ -f jurnal/jurnal.json ] || { echo "tidak ada jurnal"; exit 0; }
          git config user.name "casaham-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp jurnal/jurnal.json /tmp/jurnal_local.json
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd scripts && python jurnal_merge.py /tmp/jurnal_local.json)
            git add jurnal
            if git diff --cached --quiet; then echo "jurnal tidak berubah"; exit 0; fi
            git commit -q -m "Jurnal $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done

      - name: Simpan status alert
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
