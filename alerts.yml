# ============================================================
#  ALERT TELEGRAM
#  Edit file ini langsung di GitHub (bisa dari HP).
#  Dicek otomatis tiap ±1 menit selama jam bursa. Satu alert hanya dikirim 1x per hari.
#
# ============================================================

# Watchlist PARTY bertahap: ubah ke false untuk mematikan jenis alert tertentu.
# (Watchlist tetap berjalan di belakang layar; /watch tetap bisa dipakai.)
party:
  watchlist: true     # 📌 saham masuk watchlist PARTY
  bandar_keluar: true # ⚠️ harga di bawah tengah lonjakan (open→high), keluar watchlist
  memantul: true      # 🟢 koreksi memantul + SL/TP1/TP2
  gagal: true         # 🔴 koreksi gagal (tembus SL)
  tp: true            # 🎯 TP1 / TP2 tercapai
  tembus_high: true   # 🚀 tembus high lonjakan

# Screener lain yang hasilnya ingin dikirim ke Telegram.
# Cara pakai: salin salah satu baris contoh di bawah (tanpa tanda #),
# lalu ganti baris "screeners: []" dengan baris itu.
#
#   screeners: [bbs]
#   screeners: [bbs, oversold]
#   screeners: [bbs, oversold, vol_spike]
#   screeners: [bbs, near_ara, oversold, vol_spike, golden_cross, breakout52, value_fund, party_koreksi]
#
# Daftar id:
#   bbs           = BBS 70·3·1 (syariah, mengejar ARA)
#   bbs_lama      = BBS trial lama (naik > 10%, RSI, Stoch)
#   near_ara      = Mendekati ARA
#   vol_spike     = Volume Spike
#   golden_cross  = Golden Cross MA20/MA50
#   oversold      = Oversold mulai pantul
#   breakout52    = Dekat High 52 Minggu
#   value_fund    = Fundamental murah
#   party_koreksi = PARTY KOREKSI (screener biasa, terpisah dari watchlist PARTY)
#   (screeners: [] = semua screener lain mati)
screeners: [bbs]

# Alert harga / indikator per saham (tanpa .JK)
# kondisi: above, below, rsi_above, rsi_below, change_above, change_below
# contoh:
#   - kode: BBCA
#     below: 5000
saham: []
